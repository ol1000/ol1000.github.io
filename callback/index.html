<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign-in code</title>
<style>body{font:16px -apple-system,system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 16px}code{display:block;word-break:break-all;background:#f4f6f8;padding:12px;border-radius:8px;margin:10px 0}</style></head>
<body><h1>Tesla sign-in code</h1>
<p id="msg">Reading the page address…</p><code id="code"></code>
<p>Copy the code above and paste it into the command on your computer. This page does not store or send it anywhere.</p>
<script>
const q = new URLSearchParams(location.search);
document.getElementById('msg').textContent = q.get('code') ? 'Your code:' : (q.get('error') ? 'Tesla returned an error: ' + q.get('error') : 'No code in this address.');
document.getElementById('code').textContent = q.get('code') || '';
</script></body></html>
